<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb6c9"/>
      <stop offset="1" stop-color="#d8e8e6"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e4a5c"/>
      <stop offset="1" stop-color="#1b2f3d"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2e6c2"/>
      <stop offset="1" stop-color="#d9b96a"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="225" fill="url(#sky)"/>
  <circle cx="256" cy="256" r="225" fill="none" stroke="#17323e" stroke-width="16"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#f2e6c2" stroke-width="4" opacity="0.7"/>
  <clipPath id="clip"><circle cx="256" cy="256" r="217"/></clipPath>
  <g clip-path="url(#clip)">
    <!-- distant misty mountains -->
    <path d="M20 330 L110 210 L170 290 L250 190 L330 300 L400 220 L500 330 L500 512 L20 512 Z" fill="#5d8898" opacity="0.55"/>
    <path d="M0 380 L90 300 L180 380 L280 290 L380 385 L512 300 L512 512 L0 512 Z" fill="#3f6575" opacity="0.7"/>
    <!-- clouds / mist -->
    <ellipse cx="130" cy="330" rx="90" ry="16" fill="#eef5f2" opacity="0.75"/>
    <ellipse cx="380" cy="310" rx="100" ry="15" fill="#eef5f2" opacity="0.65"/>
    <!-- flying sword with aura -->
    <g transform="rotate(32 340 180)">
      <path d="M250 170 L390 170 L410 180 L390 190 L250 190 Z" fill="url(#blade)"/>
      <path d="M250 176 L392 176 L250 176 Z" fill="#fff8e0" opacity="0.8"/>
      <rect x="228" y="166" width="26" height="28" rx="4" fill="#7a2e2e"/>
      <circle cx="228" cy="180" r="9" fill="#d9b96a"/>
    </g>
    <path d="M225 240 Q300 195 385 150" fill="none" stroke="#f2e6c2" stroke-width="5" opacity="0.6" stroke-linecap="round"/>
    <!-- main sect hall : triple-tier pagoda roof -->
    <g>
      <!-- base platform -->
      <rect x="150" y="400" width="212" height="24" rx="6" fill="#26404f"/>
      <!-- hall body -->
      <rect x="182" y="330" width="148" height="74" fill="#e8ddc4"/>
      <rect x="204" y="348" width="28" height="56" fill="#4a2f2a"/>
      <rect x="282" y="348" width="28" height="56" fill="#4a2f2a"/>
      <rect x="242" y="352" width="30" height="52" fill="#7a2e2e"/>
      <!-- lower roof -->
      <path d="M150 336 Q256 292 362 336 L344 316 Q256 282 168 316 Z" fill="url(#roof)"/>
      <path d="M150 336 L362 336 L352 348 L160 348 Z" fill="#16242e"/>
      <!-- middle body -->
      <rect x="206" y="278" width="100" height="40" fill="#e8ddc4"/>
      <rect x="236" y="286" width="40" height="32" fill="#4a2f2a"/>
      <!-- middle roof -->
      <path d="M178 284 Q256 246 334 284 L318 266 Q256 238 194 266 Z" fill="url(#roof)"/>
      <path d="M178 284 L334 284 L326 294 L186 294 Z" fill="#16242e"/>
      <!-- top roof -->
      <path d="M204 240 Q256 204 308 240 L294 222 Q256 198 218 222 Z" fill="url(#roof)"/>
      <path d="M204 240 L308 240 L302 248 L210 248 Z" fill="#16242e"/>
      <!-- ridge ornaments -->
      <rect x="250" y="196" width="12" height="16" fill="#d9b96a"/>
      <circle cx="256" cy="192" r="6" fill="#d9b96a"/>
    </g>
    <!-- side stone lantern / pine -->
    <path d="M120 430 L120 370 Q150 380 132 402 Q156 398 138 424 L150 430 Z" fill="#234534"/>
    <rect x="112" y="428" width="16" height="8" fill="#1b3527"/>
    <!-- ground -->
    <path d="M40 512 Q256 440 472 512 Z" fill="#2c4a3a"/>
    <ellipse cx="256" cy="468" rx="180" ry="12" fill="#eef5f2" opacity="0.4"/>
  </g>
</svg>