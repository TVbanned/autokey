    <path fill="#8A6A44" d="M132,344 L380,344 L372,360 L140,360 Z"/>
    <path fill="#5D7686" d="M124,330 L388,330 L372,346 L140,346 Z"/>
    <path fill="#5D7686" d="M124,330 Q256,306 388,330 L384,334 Q256,312 128,334 Z"/>

