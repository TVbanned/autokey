    <path fill="#E8F0E6" opacity="0.6" d="M40,350 Q160,334 256,348 Q360,362 472,346 L472,364 Q360,378 256,366 Q150,352 40,366 Z"/>

    <!-- pine tree left -->
    <path fill="#5F7A63" d="M96,400 L122,336 L110,340 L132,296 L154,340 L142,336 L168,400 Z"/>
    <rect x="127" y="396" width="10" height="30" rx="3" fill="#6E5B3E"/>
