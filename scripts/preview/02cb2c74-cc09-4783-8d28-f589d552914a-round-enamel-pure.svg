      <rect x="226" y="330" width="60" height="76" fill="#A87B50"/>
      <rect x="240" y="356" width="32" height="50" rx="4" fill="#6B4A2E"/>
      <path fill="#5D7686" d="M196,332 L316,332 L296,306 L216,306 Z"/>
      <path fill="#4E6674" d="M196,332 Q256,318 316,332 L312,338 Q256,326 200,338 Z"/>
      <rect x="232" y="258" width="48" height="52" fill="#A87B50"/>
      <rect x="244" y="272" width="24" height="30" rx="3" fill="#6B4A2E"/>
      <path fill="#5D7686" d="M206,260 L306,260 L290,238 L222,238 Z"/>
      <path fill="#4E6674" d="M206,260 Q256,248 306,260 L302,265 Q256,255 210,265 Z"/>
      <rect x="238" y="200" width="36" height="42" fill="#A87B50"/>
      <path fill="#5D7686" d="M216,202 L296,202 L282,182 L230,182 Z"/>
      <path fill="#4E6674" d="M216,202 Q256,192 296,202 L292,207 Q256,198 220,207 Z"/>
      <rect x="253" y="156" width="6" height="28" fill="#8A6A44"/>
      <circle cx="256" cy="152" r="7" fill="#C89A4A"/>
    </g>

    <!-- side halls -->
    <rect x="160" y="382" width="48" height="46" fill="#96704A"/>
    <path fill="#5D7686" d="M150,384 L218,384 L204,364 L164,364 Z"/>
    <rect x="304" y="382" width="48" height="46" fill="#96704A"/>
    <path fill="#5D7686" d="M294,384 L362,384 L348,364 L308,364 Z"/>

    <!-- crossed sword behind (cultivation / martial symbol) -->
    <g transform="rotate(38 320 300)">
      <rect x="314" y="222" width="12" height="86" rx="5" fill="#D8DEE2"/>
      <path fill="#D8DEE2" d="M314,222 L320,204 L326,222 Z"/>
      <rect x="302" y="306" width="36" height="9" rx="4" fill="#C89A4A"/>
      <rect x="316" y="315" width="8" height="26" rx="3" fill="#7C5A3A"/>
      <circle cx="320" cy="346" r="6" fill="#C89A4A"/>
    </g>

    <!-- glowing qi orb (dantian cultivation) -->
    <circle cx="176" cy="240" r="26" fill="#F3E3AC" opacity="0.5"/>
    <circle cx="176" cy="240" r="15" fill="#EFD68E"/>
    <circle cx="171" cy="235" r="5" fill="#FBF3D2"/>

    <!-- stone path -->
    <path fill="#C9C2B2" d="M236,428 L276,428 L292,480 L220,480 Z"/>
    <path fill="#B5AC9A" d="M240,444 L272,444 L276,456 L236,456 Z"/>
    <path fill="#B5AC9A" d="M232,464 L280,464 L284,476 L228,476 Z"/>
