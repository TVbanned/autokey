    <path fill="#8FA894" d="M40,300 L120,200 L175,265 L240,185 L320,270 L390,195 L472,300 L472,420 L40,420 Z"/>
    <path fill="#7A957F" d="M40,330 L140,250 L210,320 L300,240 L380,315 L472,260 L472,420 L40,420 Z"/>
