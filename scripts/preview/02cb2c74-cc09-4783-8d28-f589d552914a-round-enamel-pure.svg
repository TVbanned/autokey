<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8E7B0"/>
      <stop offset="0.5" stop-color="#C89A4A"/>
      <stop offset="1" stop-color="#FFF1C9"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE8DE"/>
      <stop offset="1" stop-color="#AFC6B4"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <circle cx="256" cy="256" r="198"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5A4A2A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="230" fill="url(#goldMetal)"/>
  <path fill-rule="evenodd" fill="#B98F3E" d="M256,256 m-214,0 a214,214 0 1,0 428,0 a214,214 0 1,0 -428,0 M256,256 m-200,0 a200,200 0 1,0 400,0 a200,200 0 1,0 -400,0"/>
  <circle cx="256" cy="256" r="198" fill="url(#skyGrad)"/>

  <path fill="#FFF4D2" opacity="0.85" d="M92,160 A214,214 0 0 1 420,160 L398,168 A190,190 0 0 0 114,168 Z"/>

  <g clip-path="url(#badgeClip)">
