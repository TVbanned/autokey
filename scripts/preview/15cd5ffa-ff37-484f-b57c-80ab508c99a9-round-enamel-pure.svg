<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
<linearGradient id="goldMetal" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#F8E7B0"/>
<stop offset="0.5" stop-color="#C89A4A"/>
<stop offset="1" stop-color="#FFF1C9"/>
</linearGradient>
<linearGradient id="enamelBg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#EFE9DC"/>
<stop offset="1" stop-color="#DCD4C2"/>
</linearGradient>
<linearGradient id="inkGrad" x1="0" y1="0" x2="0" y2="1">
