<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3A3226" flood-opacity="0.25"/>
</filter>
</defs>

<circle cx="256" cy="256" r="230" fill="url(#goldMetal)"/>
