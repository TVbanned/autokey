<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
<linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#F8E7B0"/>
<stop offset="0.55" stop-color="#C89A4A"/>
<stop offset="1" stop-color="#FFF1C9"/>
</linearGradient>
<linearGradient id="goldShine" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFF6DA"/>
<stop offset="1" stop-color="#E8C878"/>
</linearGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#7FA3A8"/>
<stop offset="1" stop-color="#9FB8B2"/>
</linearGradient>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#3A2E18" flood-opacity="0.28"/>
</filter>
<clipPath id="badgeClip">
<circle cx="256" cy="256" r="198"/>
</clipPath>
</defs>

<circle cx="256" cy="256" r="230" fill="url(#goldRim)" filter="url(#softShadow)"/>
<circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldShine)" stroke-width="3" opacity="0.85"/>
<circle cx="256" cy="256" r="198" fill="url(#sky)"/>

<g clip-path="url(#badgeClip)">
