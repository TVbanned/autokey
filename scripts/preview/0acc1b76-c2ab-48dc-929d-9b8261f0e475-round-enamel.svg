<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8E7B0"/>
      <stop offset="0.5" stop-color="#C89A4A"/>
      <stop offset="1" stop-color="#FFF1C9"/>
    </linearGradient>
    <linearGradient id="goldInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBEEC4"/>
      <stop offset="1" stop-color="#D9B568"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8C7BD"/>
      <stop offset="1" stop-color="#7FA8A0"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <circle cx="256" cy="256" r="198"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#5a4517" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="230" fill="url(#gold)" filter="url(#softShadow)"/>
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#goldInner)" stroke-width="4" opacity="0.85"/>
  <circle cx="256" cy="256" r="198" fill="url(#sky)"/>

  <g clip-path="url(#badgeClip)">
    <!-- sun breaking through haze -->
    <circle cx="352" cy="150" r="34" fill="#E9D78F"/>
    <circle cx="352" cy="150" r="44" fill="#E9D78F" opacity="0.25"/>

    <!-- ruined skyscraper silhouettes -->
    <path d="M70 300 L70 190 L108 190 L108 176 L132 176 L132 300 Z" fill="#8AA79F" opacity="0.7"/>
    <path d="M386 300 L386 168 L416 168 L416 150 L442 150 L442 300 Z" fill="#8AA79F" opacity="0.7"/>
    <path d="M130 300 L130 224 L164 224 L164 300 Z" fill="#93AFA7" opacity="0.55"/>
    <rect x="392" y="180" width="8" height="8" fill="#7FA8A0"/>
    <rect x="406" y="180" width="8" height="8" fill="#7FA8A0"/>
    <rect x="420" y="180" width="8" height="8" fill="#7FA8A0"/>
    <rect x="392" y="198" width="8" height="8" fill="#7FA8A0"/>
    <rect x="406" y="198" width="8" height="8" fill="#7FA8A0"/>

    <!-- ground -->
    <path d="M58 400 Q256 372 454 400 L454 470 L58 470 Z" fill="#6E8F6A"/>

    <!-- stacked vertical farm: container tiers -->
    <path d="M180 398 L180 344 L332 344 L332 398 Z" fill="#B0746A"/>
    <path d="M196 344 L196 292 L316 292 L316 344 Z" fill="#8AA79F"/>
    <path d="M212 292 L212 244 L300 244 L300 292 Z" fill="#B0746A"/>
    <!-- container rib details (darker same-family enamel) -->
    <rect x="192" y="352" width="10" height="38" fill="#96605A"/>
    <rect x="212" y="352" width="10" height="38" fill="#96605A"/>
    <rect x="290" y="352" width="10" height="38" fill="#96605A"/>
    <rect x="310" y="352" width="10" height="38" fill="#96605A"/>
    <rect x="206" y="300" width="9" height="36" fill="#74918A"/>
    <rect x="296" y="300" width="9" height="36" fill="#74918A"/>
    <rect x="222" y="252" width="8" height="32" fill="#96605A"/>
    <rect x="282" y="252" width="8" height="32" fill="#96605A"/>
    <!-- platform edges -->
    <rect x="172" y="338" width="168" height="8" rx="3" fill="#7C5B50"/>
    <rect x="190" y="286" width="132" height="8" rx="3" fill="#7C5B50"/>
    <rect x="206" y="238" width="100" height="8" rx="3" fill="#7C5B50"/>

    <!-- crops on each tier -->
    <g fill="#6E8F6A">
      <path d="M186 338 q4 -18 8 0 q4 -22 8 0 q4 -18 8 0 Z"/>
      <path d="M300 338 q4 -18 8 0 q4 -22 8 0 q4 -18 8 0 Z"/>
      <path d="M200 286 q4 -16 7 0 q4 -20 7 0 q4 -16 7 0 Z"/>
      <path d="M288 286 q4 -16 7 0 q4 -20 7 0 q4 -16 7 0 Z"/>
      <path d="M214 238 q3 -14 6 0 q3 -18 6 0 q3 -14 6 0 Z"/>
      <path d="M274 238 q3 -14 6 0 q3 -18 6 0 q3 -14 6 0 Z"/>
    </g>
    <!-- wheat tops -->
    <g fill="#D9C379">
      <ellipse cx="256" cy="222" rx="4" ry="10"/>
      <ellipse cx="246" cy="226" rx="3.5" ry="8" transform="rotate(-18 246 226)"/>
      <ellipse cx="266" cy="226" rx="3.5" ry="8" transform="rotate(18 266 226)"/>
      <rect x="254.5" y="228" width="3" height="12"/>
    </g>

    <!-- windows glowing on tiers -->
    <rect x="238" y="356" width="14" height="18" rx="2" fill="#E9D78F"/>
    <rect x="262" y="356" width="14" height="18" rx="2" fill="#E9D78F"/>
    <rect x="246" y="304" width="16" height="16" rx="2" fill="#E9D78F"/>

    <!-- drone hovering with crate -->
    <g>
      <rect x="330" y="212" width="34" height="16" rx="7" fill="#5E7A73"/>
      <ellipse cx="322" cy="208" rx="14" ry="4" fill="#7C5B50"/>
      <ellipse cx="372" cy="208" rx="14" ry="4" fill="#7C5B50"/>
      <rect x="344" y="228" width="6" height="12" fill="#5E7A73"/>
      <rect x="336" y="240" width="22" height="16" rx="2" fill="#B0746A"/>
      <circle cx="347" cy="220" r="3" fill="#E9D78F"/>
    </g>

    <!-- small sproutling leaves floating -->
    <path d="M140 250 q10 -12 20 -4 q-10 12 -20 4 Z" fill="#6E8F6A"/>
    <path d="M120 320 q9 -11 18 -4 q-9 11 -18 4 Z" fill="#D9C379"/>
  </g>

  <!-- subtle top metal sheen -->
  <ellipse cx="256" cy="96" rx="150" ry="34" fill="#FFF6D8" opacity="0.28"/>
</svg>