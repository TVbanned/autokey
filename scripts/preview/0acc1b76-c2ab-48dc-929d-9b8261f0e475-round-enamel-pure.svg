<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8E7B0"/>
      <stop offset="0.5" stop-color="#C89A4A"/>
      <stop offset="1" stop-color="#FFF1C9"/>
    </linearGradient>
    <linearGradient id="skyEnamel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FB3A8"/>
      <stop offset="1" stop-color="#A8CBB0"/>
    </linearGradient>
    <clipPath id="badgeClip">
      <circle cx="256" cy="256" r="198"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5A4632" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 金属外圆 -->
  <circle cx="256" cy="256" r="230" fill="url(#goldMetal)"/>
  <!-- 金属内环（圆环填充） -->
  <path fill-rule="evenodd" fill="#B8894A" d="M256 46 a210 210 0 1 0 0.001 0 Z M256 58 a198 198 0 1 1 -0.001 0 Z"/>
  <!-- 珐琅内盘 -->
  <circle cx="256" cy="256" r="198" fill="url(#skyEnamel)"/>

  <g clip-path="url(#badgeClip)">
    <!-- 远景废墟楼影 -->
    <rect x="96" y="150" width="34" height="180" rx="4" fill="#8FB8AB" opacity="0.6"/>
    <rect x="382" y="170" width="30" height="170" rx="4" fill="#8FB8AB" opacity="0.6"/>
    <rect x="104" y="165" width="8" height="8" fill="#7FB3A8" opacity="0.7"/>
    <rect x="118" y="190" width="8" height="8" fill="#7FB3A8" opacity="0.7"/>
    <rect x="390" y="188" width="8" height="8" fill="#7FB3A8" opacity="0.7"/>
    <rect x="390" y="214" width="8" height="8" fill="#7FB3A8" opacity="0.7"/>

    <!-- 云朵 -->
    <path d="M150 132 a16 16 0 0 1 30 -6 a13 13 0 0 1 24 8 a11 11 0 0 1 -4 22 h-46 a12 12 0 0 1 -4 -24 Z" fill="#DCE8DC" opacity="0.85"/>
    <path d="M330 110 a13 13 0 0 1 24 -5 a11 11 0 0 1 20 7 a9 9 0 0 1 -3 18 h-38 a10 10 0 0 1 -3 -20 Z" fill="#DCE8DC" opacity="0.8"/>

    <!-- 酸雨云（顶部小灰绿云） -->
    <path d="M246 92 a14 14 0 0 1 26 -5 a12 12 0 0 1 21 7 a10 10 0 0 1 -4 20 h-40 a11 11 0 0 1 -3 -22 Z" fill="#9FAE9E" opacity="0.9"/>
    <path d="M254 122 l-6 16 a4 4 0 0 0 8 2 Z" fill="#B9D3A8"/>
    <path d="M274 122 l-6 16 a4 4 0 0 0 8 2 Z" fill="#B9D3A8"/>

    <!-- 地面：废土 + 草皮 -->
    <rect x="40" y="368" width="432" height="120" fill="#8A6B4E"/>
    <rect x="40" y="360" width="432" height="18" rx="6" fill="#7FA05C"/>
    <circle cx="120" cy="366" r="5" fill="#94B76B"/>
    <circle cx="300" cy="364" r="5" fill="#94B76B"/>
    <circle cx="392" cy="368" r="5" fill="#94B76B"/>

    <!-- 空中农场塔：底层集装箱（锈红） -->
    <g filter="url(#softShadow)">
      <rect x="168" y="286" width="176" height="78" rx="6" fill="#B5674F"/>
      <rect x="178" y="296" width="156" height="8" rx="3" fill="#9E5540"/>
      <rect x="178" y="340" width="156" height="8" rx="3" fill="#9E5540"/>
      <rect x="246" y="296" width="20" height="68" rx="3" fill="#9E5540"/>
      <!-- 中层集装箱（雾蓝） -->
      <rect x="184" y="216" width="144" height="64" rx="6" fill="#7E96A6"/>
      <rect x="194" y="226" width="124" height="7" rx="3" fill="#6B8393"/>
      <rect x="194" y="258" width="124" height="7" rx="3" fill="#6B8393"/>
      <!-- 顶层种植平台（暖木色） -->
      <rect x="200" y="168" width="112" height="42" rx="6" fill="#C79A63"/>
      <rect x="200" y="168" width="112" height="10" rx="5" fill="#8A6B4E"/>
    </g>

    <!-- 连接立柱 -->
    <rect x="206" y="210" width="8" height="8" fill="#8A6B4E"/>
    <rect x="298" y="210" width="8" height="8" fill="#8A6B4E"/>

    <!-- 顶层作物：麦穗与绿植 -->
    <path d="M224 168 c-2 -18 4 -30 4 -30 c2 8 6 20 2 30 Z" fill="#8FBF6A"/>
    <path d="M238 168 c-6 -20 0 -34 2 -38 c4 10 8 26 2 38 Z" fill="#7FA05C"/>
    <path d="M256 168 c0 -22 2 -34 4 -40 c4 12 6 26 2 40 Z" fill="#D9B45A"/>
    <path d="M274 168 c4 -18 0 -32 -2 -36 c-4 10 -6 24 -2 36 Z" fill="#8FBF6A"/>
    <path d="M288 168 c6 -16 4 -28 2 -32 c-5 8 -8 20 -4 32 Z" fill="#7FA05C"/>
    <ellipse cx="260" cy="130" rx="5" ry="8" fill="#E4C56E"/>
    <ellipse cx="252" cy="138" rx="4" ry="6" fill="#E4C56E"/>
    <ellipse cx="268" cy="138" rx="4" ry="6" fill="#E4C56E"/>

    <!-- 太阳能板（屋顶斜板） -->
    <path d="M196 160 l40 -14 l6 12 l-40 14 Z" fill="#5F7482"/>
    <path d="M276 146 l40 14 l-6 12 l-40 -14 Z" fill="#5F7482"/>

    <!-- 中层窗口作物 -->
    <rect x="216" y="238" width="18" height="26" rx="3" fill="#CFE3D2"/>
    <path d="M225 264 c-3 -10 1 -16 1 -16 c2 5 4 11 1 16 Z" fill="#7FA05C"/>
    <rect x="278" y="238" width="18" height="26" rx="3" fill="#CFE3D2"/>
    <path d="M287 264 c-3 -10 1 -16 1 -16 c2 5 4 11 1 16 Z" fill="#8FBF6A"/>

    <!-- 底层门与水箱 -->
    <rect x="196" y="318" width="26" height="46" rx="4" fill="#7E96A6"/>
    <circle cx="216" cy="340" r="3" fill="#CFE3D2"/>
    <rect x="292" y="306" width="22" height="58" rx="5" fill="#9FB4A0"/>
    <rect x="292" y="306" width="22" height="8" rx="4" fill="#8A9C8C"/>

    <!-- 梯子（填充矩形拼） -->
    <rect x="152" y="224" width="6" height="140" fill="#8A6B4E"/>
    <rect x="152" y="236" width="16" height="5" fill="#8A6B4E"/>
    <rect x="152" y="258" width="16" height="5" fill="#8A6B4E"/>
    <rect x="152" y="280" width="16" height="5" fill="#8A6B4E"/>
    <rect x="152" y="302" width="16" height="5" fill="#8A6B4E"/>
    <rect x="152" y="324" width="16" height="5" fill="#8A6B4E"/>

    <!-- 无人机 -->
    <g filter="url(#softShadow)">
      <rect x="352" y="228" width="34" height="20" rx="8" fill="#5F7482"/>
      <rect x="362" y="234" width="14" height="8" rx="3" fill="#9FE0C0"/>
      <ellipse cx="346" cy="226" rx="14" ry="5" fill="#7E96A6"/>
      <ellipse cx="392" cy="226" rx="14" ry="5" fill="#7E96A6"/>
      <rect x="344" y="228" width="4" height="6" fill="#5F7482"/>
      <rect x="390" y="228" width="4" height="6" fill="#5F7482"/>
    </g>
    <!-- 无人机吊着的水滴/补给 -->
    <path d="M369 252 c0 0 -7 10 -7 15 a7 7 0 0 0 14 0 c0 -5 -7 -15 -7 -15 Z" fill="#9FE0C0"/>

    <!-- 发光小芽（基因改造绿苗） -->
    <path d="M340 330 c-10 -4 -14 -14 -14 -14 c8 0 16 6 16 14 Z" fill="#8FBF6A"/>
    <path d="M340 330 c10 -4 14 -14 14 -14 c-8 0 -16 6 -16 14 Z" fill="#A8D47E"/>
    <rect x="337" y="328" width="6" height="14" rx="3" fill="#7FA05C"/>
    <circle cx="358" cy="312" r="3" fill="#E4C56E"/>
    <circle cx="322" cy="308" r="2.5" fill="#E4C56E"/>

    <!-- 前景小蒲公英（废土生机） -->
    <rect x="118" y="330" width="5" height="34" rx="2" fill="#7FA05C"/>
    <circle cx="120" cy="324" r="10" fill="#DCE8DC"/>
    <circle cx="120" cy="324" r="4" fill="#C7D8C8"/>

    <!-- 内盘底部柔和阴影 -->
    <path d="M58 300 a198 198 0 0 0 396 0 l0 154 l-396 0 Z" fill="#6E5844" opacity="0.12"/>
  </g>

  <!-- 顶部金属高光（填充弧形 path） -->
  <path d="M96 150 a230 230 0 0 1 320 0 a246 246 0 0 0 -320 0 Z" fill="#FFF6D8" opacity="0.55"/>
</svg>