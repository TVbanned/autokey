<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#f5f0e6"/>
      <stop offset="70%" stop-color="#e8e0cf"/>
      <stop offset="100%" stop-color="#d5cab3"/>
    </radialGradient>
    <linearGradient id="blade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#9a9a9a"/>
    </linearGradient>
  </defs>

  <!-- outer badge ring -->
  <circle cx="256" cy="256" r="225" fill="#1a1a1a"/>
  <circle cx="256" cy="256" r="212" fill="url(#bg)"/>

  <!-- ink brushstroke ring (broken circle, enso style) -->
  <path d="M256 58
           C 150 58 62 148 62 252
           C 62 350 140 432 236 444
           C 246 445 250 436 242 431
           C 160 415 92 342 92 252
           C 92 162 168 88 256 88
           C 344 88 420 162 420 252
           C 420 300 402 345 368 378
           C 361 385 369 394 377 388
           C 418 352 450 306 450 252
           C 450 148 362 58 256 58 Z"
        fill="#141414"/>

  <!-- ink splatter dots -->
  <circle cx="386" cy="394" r="7" fill="#141414"/>
  <circle cx="404" cy="378" r="4" fill="#141414"/>
  <circle cx="414" cy="398" r="3" fill="#141414"/>

  <!-- fox tail ink swirl behind sword -->
  <path d="M150 360
           C 130 320 150 280 200 268
           C 260 254 320 280 330 230
           C 336 200 318 176 292 172
           C 300 190 296 206 280 214
           C 246 232 190 224 158 258
           C 128 290 126 330 150 360 Z"
        fill="#2b2b2b" opacity="0.9"/>
  <path d="M292 172 C 306 178 316 192 314 210 C 328 196 324 172 302 162 Z" fill="#8f1f1f"/>

  <!-- sword (brush-sword), diagonal -->
  <g transform="rotate(38 256 256)">
    <!-- blade -->
    <path d="M250 120 L256 78 L262 120 L262 300 L250 300 Z" fill="url(#blade)"/>
    <path d="M256 78 L262 120 L262 300 L256 300 Z" fill="#5a5a5a"/>
    <!-- ink drip on blade tip -->
    <path d="M256 78 C 250 100 248 112 250 122 L262 122 C 264 112 262 100 256 78 Z" fill="#141414"/>
    <!-- guard -->
    <rect x="226" y="300" width="60" height="12" rx="6" fill="#8f1f1f"/>
    <!-- handle -->
    <rect x="248" y="312" width="16" height="60" rx="7" fill="#141414"/>
    <rect x="248" y="322" width="16" height="6" fill="#8f1f1f"/>
    <rect x="248" y="340" width="16" height="6" fill="#8f1f1f"/>
    <!-- pommel -->
    <circle cx="256" cy="380" r="10" fill="#8f1f1f"/>
  </g>

  <!-- red ink splash accents -->
  <circle cx="176" cy="170" r="6" fill="#8f1f1f"/>
  <circle cx="342" cy="330" r="5" fill="#8f1f1f"/>

  <!-- ink wash ground stroke -->
  <path d="M140 400 C 200 388 310 388 372 402 C 320 414 200 416 140 400 Z" fill="#141414" opacity="0.85"/>
</svg>